<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BÀI 10 - MỤC LỤC</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px 50px;
            font-family: Arial, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin: 10px 0 35px;
        }

        .section {
            background: #fff;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            font-size: 28px;
            margin: 0 0 20px;
        }

        /* BÀI HỌC */

        .html-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .html-list a {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            padding: 12px 18px;
            border-radius: 12px;
            background: #eef3ff;
            color: #1d4ed8;
            text-decoration: none;
            font-size: 21px;
            font-weight: 600;
            border: 1px solid #dbe5ff;
        }

        .html-list a:hover {
            background: #dfe9ff;
        }

        /* BĂNG NGHE */

        .audio-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .audio-item {
            padding: 15px 18px;
            border-radius: 12px;
            background: #f7f7f7;
            border: 1px solid #e5e5e5;
        }

        .audio-name {
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
            height: 48px;
        }

        @media (max-width: 650px) {
            body {
                padding: 20px 12px 35px;
            }

            h1 {
                font-size: 30px;
            }

            .section {
                padding: 18px;
            }

            .section h2 {
                font-size: 25px;
            }

            .html-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>BÀI 10 - MỤC LỤC</h1>

    <!-- BÀI HỌC -->
    <div class="section">
        <h2>📚 BÀI HỌC</h2>

        <div class="html-list">

            <a href="PC00210BaiKhoa.html" target="_blank" rel="noopener noreferrer">
                BÀI KHÓA
            </a>

            <a href="PC00210TuMoi.html" target="_blank" rel="noopener noreferrer">
                TỪ MỚI
            </a>

            <a href="PC00210NguPhap.html" target="_blank" rel="noopener noreferrer">
                NGỮ PHÁP
            </a>

            <a href="PC00210ChuHan.html" target="_blank" rel="noopener noreferrer">
                CHỮ HÁN
            </a>

        </div>
    </div>

    <!-- BĂNG NGHE -->
    <div class="section">
        <h2>🔊 BĂNG NGHE</h2>

        <div class="audio-list">

            <div class="audio-item">
                <div class="audio-name">BÀI KHÓA 1</div>
                <audio controls preload="metadata">
                    <source src="audio/PC00210BaiKhoa1.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="audio-item">
                <div class="audio-name">BÀI KHÓA 2</div>
                <audio controls preload="metadata">
                    <source src="audio/PC00210BaiKhoa2.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="audio-item">
                <div class="audio-name">BÀI KHÓA 3</div>
                <audio controls preload="metadata">
                    <source src="audio/PC00210BaiKhoa3.mp3" type="audio/mpeg">
                </audio>
            </div>

            <div class="audio-item">
                <div class="audio-name">TỪ MỚI</div>
                <audio controls preload="metadata">
                    <source src="audio/PC00210TuMoi.mp3" type="audio/mpeg">
                </audio>
            </div>

        </div>
    </div>

</div>

</body>
</html>
